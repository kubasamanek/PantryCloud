name: CI/CD - IdentityService

on:
  push:
    branches:
      - develop
      - master
      - 'release/**'
    paths:
      - 'src/Services/PantryCloud.Identity/**'
      - 'src/BuildingBlocks/**'
      - 'test/PantryCloud.Identity/**'
      - '.github/workflows/identity.yml'
      - '.github/workflows/base.yml'
  pull_request:
    branches:
      - develop
      - master
    paths:
      - 'src/Services/PantryCloud.Identity/**'
      - 'src/BuildingBlocks/**'
      - 'test/PantryCloud.Identity/**'
      - '.github/workflows/identity.yml'
      - '.github/workflows/base.yml'
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/base.yml
    with:
      service_project_path: src/Services/PantryCloud.Identity/PantryCloud.Identity.Presentation/PantryCloud.Identity.Presentation.csproj
      unit_test_project_path: test/PantryCloud.Identity/PantryCloud.Identity.UnitTests/PantryCloud.Identity.UnitTests.csproj
      integration_test_project_path: test/PantryCloud.Identity/PantryCloud.Identity.IntegrationTests/PantryCloud.Identity.IntegrationTests.csproj
      dockerfile_path: src/Services/PantryCloud.Identity/PantryCloud.Identity.Presentation/Dockerfile
      image_name: samanekj/identityservice
      test_image_name: pantrycloud-identity-test:latest
      coverage_flag: identity-service
      test_results_name: "IdentityService - Test Results"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}