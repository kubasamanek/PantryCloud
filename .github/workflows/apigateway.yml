name: CI/CD - ApiGateway

on:
  push:
    branches:
      - develop
    paths:
      - 'src/Gateways/PantryCloud.ApiGateway/**'
      - 'src/BuildingBlocks/**'
      - 'test/PantryCloud.ApiGateway/**'
      - '.github/workflows/apigateway.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'src/Gateways/PantryCloud.ApiGateway/**'
      - 'src/BuildingBlocks/**'
      - 'test/PantryCloud.ApiGateway/**'
      - '.github/workflows/apigateway.yml'
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/base.yml
    with:
      service_project_path: src/Gateways/PantryCloud.ApiGateway/PantryCloud.ApiGateway.Presentation/PantryCloud.ApiGateway.Presentation.csproj
      unit_test_project_path: test/PantryCloud.ApiGateway/PantryCloud.ApiGateway.UnitTests/PantryCloud.ApiGateway.UnitTests.csproj
      # No integration tests for ApiGateway
      dockerfile_path: src/Gateways/PantryCloud.ApiGateway/PantryCloud.ApiGateway.Presentation/Dockerfile
      image_name: samanekj/apigateway
      coverage_flag: api-gateway
      test_results_name: "ApiGateway - Test Results"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
