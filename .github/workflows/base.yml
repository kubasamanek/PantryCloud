name: Reusable Service Pipeline

on:
  workflow_call:
    inputs:
      service_project_path:
        required: true
        type: string
        description: "Path to the service project file (e.g., src/Services/.../Service.csproj)"
      unit_test_project_path:
        required: false
        type: string
        description: "Path to the unit test project file (optional)"
      integration_test_project_path:
        required: false
        type: string
        description: "Path to the integration test project file (optional)"
      dockerfile_path:
        required: false
        type: string
        description: "Path to the Dockerfile (optional, triggers CD if set)"
      image_name:
        required: false
        type: string
        description: "Docker image name (required if dockerfile_path is set)"
      test_image_name:
        required: false
        type: string
        description: "Docker image tag used by integration tests (e.g. pantrycloud-household-test:latest)"
      dotnet_version:
        required: false
        type: string
        default: '9.0.x'
        description: ".NET SDK version"
      coverage_flag:
        required: false
        type: string
        description: "Codecov flag name (e.g., identity-service)"
      test_results_name:
        required: false
        type: string
        description: "Name for test results check (e.g., 'IdentityService - Test Results')"
        
    secrets:
      CODECOV_TOKEN:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.service_project_path }}

      - name: Build
        run: dotnet build ${{ inputs.service_project_path }} --no-restore --configuration Release

  test:
    name: Test & Coverage
    needs: build
    if: inputs.unit_test_project_path != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore dependencies
        run: |
          dotnet restore ${{ inputs.unit_test_project_path }}
          if [ -n "${{ inputs.integration_test_project_path }}" ]; then
            dotnet restore ${{ inputs.integration_test_project_path }}
          fi

      - name: Build tests
        run: |
          dotnet build ${{ inputs.unit_test_project_path }} --no-restore --configuration Release
          if [ -n "${{ inputs.integration_test_project_path }}" ]; then
            dotnet build ${{ inputs.integration_test_project_path }} --no-restore --configuration Release
          fi

      - name: Run Unit Tests with Coverage
        run: |
          dotnet test ${{ inputs.unit_test_project_path }} \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/unit \
            --logger "trx;LogFileName=unit_test_results.trx" \
            --verbosity normal

      - name: Pre-build service Docker image for Integration Tests
        if: inputs.integration_test_project_path != '' && inputs.test_image_name != ''
        run: docker build -t ${{ inputs.test_image_name }} -f ${{ inputs.dockerfile_path }} .

      - name: Run Integration Tests with Coverage
        if: inputs.integration_test_project_path != ''
        run: |
          dotnet test ${{ inputs.integration_test_project_path }} \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage/integration \
            --logger "trx;LogFileName=integration_test_results.trx" \
            --verbosity normal
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Cleanup Docker containers
        if: always() && inputs.integration_test_project_path != ''
        run: |
          docker ps -aq --filter "label=org.testcontainers=true" | xargs -r docker rm -f || true

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        if: always()
        run: |
          reportgenerator \
            "-reports:./coverage/**/coverage.cobertura.xml" \
            "-targetdir:./coverage/report" \
            "-reporttypes:Html;Cobertura;TextSummary"

      - name: Display Coverage Summary
        if: always()
        run: cat ./coverage/report/Summary.txt

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && inputs.coverage_flag != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/coverage.cobertura.xml
          flags: ${{ inputs.coverage_flag }}
          name: ${{ inputs.coverage_flag }}-coverage
          fail_ci_if_error: false

      - name: Upload Test Results to Codecov
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && inputs.coverage_flag != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/*.trx
          report_type: test_results
          flags: ${{ inputs.coverage_flag }}

      - name: Upload Coverage Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ inputs.coverage_flag || 'unknown' }}
          path: ./coverage/report/
          retention-days: 30

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && !cancelled()
        with:
          files: './coverage/**/*.trx'
          check_name: "${{ inputs.test_results_name || 'Test Results' }}"
          check_run: false
          comment_mode: off

  cd:
    name: Build & Push Docker Image
    needs: [build, test]
    # Run CD if:
    # 1. dockerfile_path is provided
    # 2. It is a push to develop
    # 3. Build succeeded
    # 4. Test phase succeeded OR was skipped (because unit_test_project_path was empty)
    if: |
      always() && 
      inputs.dockerfile_path != '' && 
      github.event_name == 'push' && 
      github.ref == 'refs/heads/develop' &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          skip-dirs: 'src/Services/PantryCloud.Identity/PantryCloud.Identity.Presentation/Secrets'

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.3.x'

      - name: Generate GitVersion variables
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ steps.gitversion.outputs.semVer }}
            ${{ inputs.image_name }}:latest
