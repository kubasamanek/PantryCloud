name: CI/CD - AuditService

on:
  push:
    branches:
      - develop
    paths:
      - 'src/Services/PantryCloud.Audit/**'
      - 'src/BuildingBlocks/**'
      - 'test/PantryCloud.Audit/**'
      - '.github/workflows/audit.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'src/Services/PantryCloud.Audit/**'
      - 'src/Services/PantryCloud.Household/PantryCloud.Household.Application/**'
      - 'src/Services/PantryCloud.Pantry/PantryCloud.Pantry.Application/**'
      - 'src/Services/PantryCloud.ShoppingList/PantryCloud.ShoppingList.Application/**'
      - 'src/BuildingBlocks/**'
      - 'test/PantryCloud.Audit/**'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

env:
  SERVICE_PROJECT: src/Services/PantryCloud.Audit/PantryCloud.Audit.Presentation/PantryCloud.Audit.Presentation.csproj
  TEST_PROJECT: test/PantryCloud.Audit/PantryCloud.Audit.UnitTests/PantryCloud.Audit.UnitTests.csproj
  DOCKERFILE_PATH: src/Services/PantryCloud.Audit/PantryCloud.Audit.Presentation/Dockerfile
  IMAGE_NAME: samanekj/auditservice

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.SERVICE_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.SERVICE_PROJECT }} --no-restore --configuration Release

  test:
    name: Test & Coverage
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build tests
        run: dotnet build ${{ env.TEST_PROJECT }} --no-restore --configuration Release

      - name: Run Unit Tests with Coverage
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --logger "trx;LogFileName=test_results.trx" \
            --verbosity normal

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            "-reports:./coverage/**/coverage.cobertura.xml" \
            "-targetdir:./coverage/report" \
            "-reporttypes:Html;Cobertura;TextSummary"

      - name: Display Coverage Summary
        run: cat ./coverage/report/Summary.txt

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/coverage.cobertura.xml
          flags: audit-service
          name: audit-service-coverage
          fail_ci_if_error: false

      - name: Upload Test Results to Codecov
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/*.trx
          report_type: test_results
          flags: audit-service

      - name: Upload Coverage Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-audit
          path: ./coverage/report/
          retention-days: 30

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && !cancelled()
        with:
          files: './coverage/**/*.trx'
          check_name: "AuditService - Test Results"
          check_run: false
          comment_mode: off

  cd:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.3.x'

      - name: Generate GitVersion variables
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.semVer }}
            ${{ env.IMAGE_NAME }}:latest
