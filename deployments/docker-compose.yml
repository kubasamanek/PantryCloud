name: pantry-cloud-dev

services:
  # --- INFRASTRUCTURE ---
  postgres:
    image: postgres:16-alpine
    container_name: pantry-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pantry-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pantry-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - pantry-network

  # --- GATEWAY ---
  api-gateway:
    container_name: pantry-gateway
    build:
      context: ../
      dockerfile: src/Gateways/PantryCloud.ApiGateway/PantryCloud.ApiGateway.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - Services__IdentityService=http://identity-api:8080
      - Services__HouseholdService=http://household-api:8080
      - Services__PantryService=http://pantry-api:8080
      - Services__RecipeService=http://recipe-api:8080
      - Services__ShoppingListService=http://shoppinglist-api:8080
      - Gateway__EnableSwagger=true
      - Jwt__Issuer=pantry-identity
      - Jwt__Audience=pantry-cloud
      - App__IdentityUrl=http://identity-api:8080
    ports:
      - "5050:8080"
    depends_on:
      - identity-api
      - household-api
      - pantry-api
    networks:
      - pantry-network

  # --- SERVICES ---
  identity-api:
    container_name: pantry-identity
    build:
      context: ../
      dockerfile: src/Services/PantryCloud.Identity/PantryCloud.Identity.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - IsDevelopment=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=identity_db;Username=admin;Password=password;
      - Jwt__Issuer=pantry-identity
      - Jwt__Audience=pantry-cloud
      - Jwt__ExpirationInMinutes=60
      - Jwt__PrivateKeyPath=/app/secrets/private.pem
      - Jwt__PublicKeyPath=/app/secrets/public.pem
      - App__FrontendUrl=http://localhost:3000
      - App__ResetPasswordTokenExpirationInMinutes=60
      - App__VerifyEmailTokenExpirationInMinutes=60
      - Email__Host=localhost
      - Email__Port=2525
      - Email__Username=
      - Email__Password=
      - Email__From=admin@pantrycloud.dev
    ports:
      - "5072:8080"
    volumes:
      - ../src/Services/PantryCloud.Identity/PantryCloud.Identity.Presentation/Secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pantry-network

  household-api:
    container_name: pantry-household
    build:
      context: ../
      dockerfile: src/Services/PantryCloud.Household/PantryCloud.Household.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - IsDevelopment=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=household_db;Username=admin;Password=password;
      - App__IdentityUrl=http://identity-api:8080
      - Jwt__Issuer=pantry-identity
      - Jwt__Audience=pantry-cloud
      - Messaging__RabbitMQ__Host=rabbitmq
      - Messaging__RabbitMQ__Username=admin
      - Messaging__RabbitMQ__Password=password
    ports:
      - "5155:8080"
    depends_on:
      postgres:
        condition: service_healthy
      identity-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - pantry-network

  pantry-api:
    container_name: pantry-pantry
    build:
      context: ../
      dockerfile: src/Services/PantryCloud.Pantry/PantryCloud.Pantry.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - IsDevelopment=true
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=pantry_db;Username=admin;Password=password;
      - Services__HouseholdService=http://household-api:8080
      - App__IdentityUrl=http://identity-api:8080
      - Jwt__Issuer=pantry-identity
      - Jwt__Audience=pantry-cloud
      - Messaging__RabbitMQ__Host=rabbitmq
      - Messaging__RabbitMQ__Username=admin
      - Messaging__RabbitMQ__Password=password
    ports:
      - "5073:8080"
    depends_on:
      postgres:
        condition: service_healthy
      identity-api:
        condition: service_started
      household-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - pantry-network

  notification-api:
    container_name: pantry-notification
    build:
      context: ../
      dockerfile: src/Services/PantryCloud.Notification/PantryCloud.Notification.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - IsDevelopment=true
      - Messaging__RabbitMQ__Host=rabbitmq
      - Messaging__RabbitMQ__Username=admin
      - Messaging__RabbitMQ__Password=password
    ports:
      - "5160:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pantry-network

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  pantry-network:
    driver: bridge