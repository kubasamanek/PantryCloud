replicaCount: 1

image:
  repository: samanekj/pantryservice
  tag: latest

fullnameOverride: pantry-api

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  Jwt__Issuer: pantry-identity
  Jwt__Audience: pantry-cloud
  App__IdentityUrl: http://identity-api:8080
  Services__HouseholdService: http://household-api:8080
  Messaging__RabbitMQ__Host: pantry-rabbitmq
  ExpirationCheck__Enabled: "true"
  ExpirationCheck__IntervalHours: "24"
  ExpirationCheck__BatchSize: "50"

existingSecrets:
  - pantry-api-secrets
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: 1
