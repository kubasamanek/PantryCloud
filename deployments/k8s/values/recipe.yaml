replicaCount: 1

image:
  repository: samanekj/recipeservice
  tag: latest

fullnameOverride: recipe-api

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  Jwt__Issuer: pantry-identity
  Jwt__Audience: pantry-cloud
  App__IdentityUrl: http://identity-api:8080
  MongoDB__DatabaseName: recipe_db

existingSecrets:
  - recipe-api-secrets

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
