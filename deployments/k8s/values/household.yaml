replicaCount: 1

image:
  repository: samanekj/householdservice
  tag: latest

fullnameOverride: household-api

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  Jwt__Issuer: pantry-identity
  Jwt__Audience: pantry-cloud
  App__IdentityUrl: http://identity-api:8080
  App__FrontendUrl: http://pantry.test
  App__InvitationExpirationMinutes: "2"
  Messaging__RabbitMQ__Host: pantry-rabbitmq

existingSecrets:
  - household-api-secrets
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: 1
