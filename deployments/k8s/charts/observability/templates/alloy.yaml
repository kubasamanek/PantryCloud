# -------------------------------------------------------------------
# ServiceAccount + ClusterRole + ClusterRoleBinding
# -------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.alloy.serviceName }}
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.alloy.serviceName }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.alloy.serviceName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.alloy.serviceName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.alloy.serviceName }}
    namespace: {{ .Values.namespace }}
---
# -------------------------------------------------------------------
# ConfigMap: Alloy pipeline configuration (logs only for now)
# -------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.alloy.serviceName }}-config
  namespace: {{ .Values.namespace }}
data:
  config.alloy: |
    // ── Kubernetes pod discovery ──────────────────────
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        names = ["{{ .Values.namespace }}"]
      }
    }

    // ── Relabel: extract pod metadata as labels ──────
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
        target_label  = "service"
      }
    }

    // ── Tail container log files ─────────────────────
    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.json_logs.receiver]
    }

    // ── Extract level from Serilog compact JSON logs ──
    loki.process "json_logs" {
      forward_to = [loki.write.loki.receiver]

      stage.regex {
        expression = "\"@l\":\"(?P<level>[^\"]+)\""
      }

      stage.labels {
        values = {
          level = "",
        }
      }
    }

    // ── Push to Loki ─────────────────────────────────
    loki.write "loki" {
      endpoint {
        url = "http://{{ .Values.loki.serviceName }}:{{ .Values.loki.port }}/loki/api/v1/push"
      }
    }
---
# -------------------------------------------------------------------
# DaemonSet: one Alloy pod per node
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.alloy.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Values.alloy.serviceName }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: {{ .Values.alloy.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: {{ .Values.alloy.serviceName }}
    spec:
      serviceAccountName: {{ .Values.alloy.serviceName }}
      containers:
        - name: alloy
          image: {{ .Values.alloy.image }}
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--server.http.listen-addr=0.0.0.0:12345"
            - "--stability.level=public-preview"
          ports:
            - containerPort: 12345
              name: http
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ .Values.alloy.serviceName }}-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: docker-logs
          hostPath:
            path: /var/lib/docker/containers
