# -------------------------------------------------------------------
# Secret: Grafana admin credentials
# -------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.grafana.serviceName }}-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "{{ .Values.grafana.adminUser }}"
  GF_SECURITY_ADMIN_PASSWORD: "{{ .Values.grafana.adminPassword }}"
---
# -------------------------------------------------------------------
# ConfigMap: Provisioned data sources
# -------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.serviceName }}-datasources
  namespace: {{ .Values.namespace }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: "http://{{ .Values.prometheus.serviceName }}:{{ .Values.prometheus.port }}"
        isDefault: true
        editable: false
        jsonData:
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: "http://{{ .Values.loki.serviceName }}:{{ .Values.loki.port }}"
        editable: false
        jsonData:
          derivedFields:
            - name: TraceId
              matcherRegex: '"TraceId":"(\w+)"'
              url: "$${__value.raw}"
              datasourceUid: tempo
              matcherType: label
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: "http://{{ .Values.tempo.serviceName }}:{{ .Values.tempo.port }}"
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            filterBySpanID: false
          tracesToMetrics:
            datasourceUid: prometheus
            tags:
              - key: service.name
                value: service
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: prometheus
---
# -------------------------------------------------------------------
# ConfigMap: Dashboard provider
# -------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.serviceName }}-dashboard-provider
  namespace: {{ .Values.namespace }}
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: PantryCloud
        orgId: 1
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards/json
---
# -------------------------------------------------------------------
# ConfigMap: dashboard JSON
# -------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.serviceName }}-dashboards
  namespace: {{ .Values.namespace }}
data:
  pantrycloud.json: |
    {
      "title": "PantryCloud Services",
      "uid": "pantrycloud-services",
      "tags": ["pantrycloud"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "sum by (service) (rate(http_requests_received_total[1m]))",
            "legendFormat": "{{ "{{" }}service{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 2,
          "title": "HTTP Request Duration P95 (ms)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[1m]))) * 1000",
            "legendFormat": "{{ "{{" }}service{{ "}}" }} p95"
          }],
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 3,
          "title": "HTTP Error Rate (4xx + 5xx)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "sum by (service) (rate(http_requests_received_total{code=~\"4..|5..\"}[1m]))",
            "legendFormat": "{{ "{{" }}service{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 4,
          "title": ".NET Process Memory (MB)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "process_working_set_bytes / 1024 / 1024",
            "legendFormat": "{{ "{{" }}instance{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "decmbytes", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 5,
          "title": "GC Collections per Second",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "rate(dotnet_collection_count_total{generation=\"0\"}[1m])",
              "legendFormat": "gen0 {{ "{{" }}instance{{ "}}" }}"
            },
            {
              "datasource": { "type": "prometheus" },
              "expr": "rate(dotnet_collection_count_total{generation=\"1\"}[1m])",
              "legendFormat": "gen1 {{ "{{" }}instance{{ "}}" }}"
            },
            {
              "datasource": { "type": "prometheus" },
              "expr": "rate(dotnet_collection_count_total{generation=\"2\"}[1m])",
              "legendFormat": "gen2 {{ "{{" }}instance{{ "}}" }}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "cps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 6,
          "title": "Active HTTP Requests In-Flight",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "http_requests_in_progress",
            "legendFormat": "{{ "{{" }}instance{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 7,
          "title": "Request Rate by Status Code",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 24, "h": 8 },
          "targets": [{
            "datasource": { "type": "prometheus" },
            "expr": "sum by (code, service) (rate(http_requests_received_total[1m]))",
            "legendFormat": "{{ "{{" }}service{{ "}}" }} HTTP {{ "{{" }}code{{ "}}" }}"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        }
      ]
    }
---
# -------------------------------------------------------------------
# PersistentVolumeClaim
# -------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.grafana.serviceName }}-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.grafana.storage }}
---
# -------------------------------------------------------------------
# Deployment
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.grafana.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Values.grafana.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Values.grafana.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Values.grafana.serviceName }}
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - containerPort: {{ .Values.grafana.port }}
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.grafana.serviceName }}-credentials
          env:
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH

          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/json
            - name: data
              mountPath: /var/lib/grafana
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: {{ .Values.grafana.serviceName }}-datasources
        - name: dashboard-provider
          configMap:
            name: {{ .Values.grafana.serviceName }}-dashboard-provider
        - name: dashboard-json
          configMap:
            name: {{ .Values.grafana.serviceName }}-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.grafana.serviceName }}-data
---
# -------------------------------------------------------------------
# Service
# -------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.grafana.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Values.grafana.serviceName }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.grafana.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Values.grafana.serviceName }}
