# -------------------------------------------------------------------
# ConfigMap: Tempo configuration
# -------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.tempo.serviceName }}-config
  namespace: {{ .Values.namespace }}
data:
  tempo.yaml: |
    server:
      http_listen_port: {{ .Values.tempo.port }}

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:{{ .Values.tempo.otlpGrpcPort }}"

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retentionPeriod }}

    metrics_generator:
      storage:
        path: /var/tempo/generator/wal
---
# -------------------------------------------------------------------
# PersistentVolumeClaim
# -------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.tempo.serviceName }}-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.tempo.storage }}
---
# -------------------------------------------------------------------
# Deployment
# -------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.tempo.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: {{ .Values.tempo.serviceName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/instance: {{ .Values.tempo.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/instance: {{ .Values.tempo.serviceName }}
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: tempo
          image: {{ .Values.tempo.image }}
          args:
            - "-config.file=/etc/tempo/tempo.yaml"
          ports:
            - containerPort: {{ .Values.tempo.port }}
              name: http
              protocol: TCP
            - containerPort: {{ .Values.tempo.otlpGrpcPort }}
              name: otlp-grpc
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ .Values.tempo.serviceName }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.tempo.serviceName }}-data
---
# -------------------------------------------------------------------
# Service
# -------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.tempo.serviceName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: {{ .Values.tempo.serviceName }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.tempo.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.tempo.otlpGrpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: {{ .Values.tempo.serviceName }}
