namespace: pantry

prometheus:
  image: prom/prometheus:v3.9.1
  serviceName: pantry-prometheus
  port: 9090
  storage: 2Gi
  retention: 15d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  image: grafana/grafana:12.3.3
  serviceName: pantry-grafana
  port: 3000
  storage: 1Gi
  adminUser: admin
  adminPassword: admin
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
