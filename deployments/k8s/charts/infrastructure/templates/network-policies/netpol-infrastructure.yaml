# ===================================================================
# PostgreSQL
# ===================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: [identity, household, pantry, shoppinglist, notification, audit]
      ports:
        - port: 5432
          protocol: TCP
---
