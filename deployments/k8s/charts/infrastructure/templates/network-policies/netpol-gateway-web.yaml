# ===================================================================
# API Gateway
# ===================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Ingress-nginx > Gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
    # Prometheus > Gateway (metrics scrape)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Gateway > all microservices (reverse proxy)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pantry-microservice
      ports:
        - port: 8080
          protocol: TCP
    # Gateway > Alloy (OTLP traces)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - port: 4317
          protocol: TCP
---
# ===================================================================
# Web (static SPA - ingress only)
# ===================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 80
          protocol: TCP
