# ===================================================================
# Identity JWKS ingress - all services + gateway fetch signing keys
# ===================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-identity-jwks
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: identity
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pantry-microservice
      ports:
        - port: 8080
          protocol: TCP
